<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f13" />
    <title>Queue Music</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="conn-banner" class="conn-banner hidden">connection lost — retrying…</div>

    <section id="view-login" class="view">
      <div class="login-box">
        <h1 class="logo">Queue Music</h1>
        <p class="tagline">Party queue for LAN friends</p>
        <input id="login-name" type="text" maxlength="40" placeholder="Your name" autocomplete="name" />
        <button id="login-btn" class="primary">Join</button>
        <p id="login-error" class="error"></p>
      </div>
    </section>

    <section id="view-home" class="view hidden">
      <header class="topbar">
        <span class="appname">Queue Music</span>
        <span id="online-badge" class="online" title="">0 friends</span>
        <button id="logout-btn" class="ghost">Leave</button>
      </header>

      <main class="content">
        <section class="card">
          <h2>Party queue</h2>
          <ul id="party-queue" class="list"></ul>
        </section>

        <section class="card">
          <h2>Search</h2>
          <div class="search-row">
            <input id="search-input" type="text" placeholder="Search YouTube…" autocomplete="off" />
            <button id="search-btn" class="primary">Search</button>
          </div>
          <ul id="search-results" class="list"></ul>
        </section>

        <section class="card">
          <h2>My queue</h2>
          <ul id="my-queue" class="list"></ul>
        </section>
      </main>

      <footer id="player-bar" class="player-bar"></footer>
    </section>

    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
  </body>
</html>
